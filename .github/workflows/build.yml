name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths-ignore:
      - '.github/workflows/discover.yml'
      - '**/*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle & Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle', 'settings.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        id: gradle_build
        continue-on-error: true
        run: |
          mkdir -p ci-out
          set -o pipefail
          ./gradlew build --stacktrace --console=plain 2>&1 | tee ci-out/build.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Collect build output
        if: always()
        run: |
          mkdir -p ci-out
          {
            echo "# commit: ${GITHUB_SHA}"
            echo "# run: ${GITHUB_RUN_ID}"
            echo
            echo "## jars"
            ls -la build/libs 2>/dev/null || echo "(no build/libs)"
            echo
            echo "## errors"
            grep -nE -A 3 "error:|FAILURE:|What went wrong|Caused by:" ci-out/build.txt 2>/dev/null | head -200 || true
          } > ci-out/summary.txt
          cat ci-out/summary.txt

      - name: Publish CI output to ci-logs branch
        if: always()
        run: |
          rm -rf /tmp/ci-logs && mkdir -p /tmp/ci-logs
          cp -r ci-out/* /tmp/ci-logs/ 2>/dev/null || true
          cd /tmp/ci-logs
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b ci-logs
          git add -A
          git commit -q -m "CI output for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soulsouls-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Fail if the build failed
        if: always()
        run: |
          test -n "$(ls build/libs/*.jar 2>/dev/null)" || { echo "No jar produced"; exit 1; }
