name: Discover Fabric versions

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/discover.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: All loom versions
        run: |
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml \
            | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tr '\n' ' '
      - name: Latest patch per loom minor
        run: |
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml \
            | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep -E '^1\.[0-9]+\.[0-9]+$' \
            | awk -F. '{print $1"."$2, $0}' | sort -k1,1V -k2,2V | awk '{a[$1]=$2} END {for (k in a) print k" -> "a[k]}' | sort -V
