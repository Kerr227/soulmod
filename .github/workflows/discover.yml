name: Discover Fabric versions

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/discover.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Loom plugin versions
        run: curl -s https://maven.fabricmc.net/net/fabricmc/loom/net.fabricmc.loom.gradle.plugin/maven-metadata.xml | tail -30
      - name: Loom artifact versions
        run: curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | tail -30
      - name: Loom directory listing
        run: curl -s https://maven.fabricmc.net/net/fabricmc/ | grep -io 'loom[^<"]*' | sort -u | head -20
