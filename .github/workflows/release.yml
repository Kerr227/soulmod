name: Release

# Publishes the compiled mod jar as a GitHub Release so it can be downloaded
# without digging through Actions artifacts.
#
# Edit dev/RELEASE (any change) and push: the tag is taken from mod_version in
# gradle.properties, so bump that first. You can also run this workflow by hand and
# give it a tag name.

on:
  push:
    branches:
      - '**'
    paths:
      - 'dev/RELEASE'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle & Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle', 'settings.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain

      - name: Show what was built
        run: ls -la build/libs

      - name: Work out the tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Soul Souls ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
