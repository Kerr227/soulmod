name: Loom matrix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/loom-matrix.yml'

jobs:
  loom:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loom: '1.16.3'
            extra: ''
          - loom: '1.17.19'
            extra: ''
          - loom: '1.15.5'
            extra: ''
          - loom: '1.16.3'
            extra: '-Pfull_api=true'
    name: loom-${{ matrix.loom }}${{ matrix.extra }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x ./gradlew
      - name: Try to set up Minecraft 1.21.11
        run: |
          set +e
          ./gradlew classes -Ploom_version=${{ matrix.loom }} ${{ matrix.extra }} --console=plain > out.txt 2>&1
          code=$?
          echo "=================== SUMMARY (exit $code) ==================="
          if [ $code -eq 0 ]; then
            echo "PASS loom=${{ matrix.loom }} ${{ matrix.extra }}"
          else
            grep -E "What went wrong" -A 6 out.txt | head -20
            grep -iE "error:|Caused by" out.txt | head -10
          fi
          exit $code
