name: Loom matrix

on:
  workflow_dispatch:

jobs:
  loom:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loom: ['1.13.6', '1.14.10', '1.15.5', '1.16.3']
    name: loom-${{ matrix.loom }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x ./gradlew
      - name: Try to set up Minecraft 1.21.11
        run: ./gradlew classes -Ploom_version=${{ matrix.loom }} --console=plain --stacktrace
