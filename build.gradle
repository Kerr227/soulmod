plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    if (project.hasProperty('full_api')) {
        // Escape hatch: compile against the whole Fabric API bundle.
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    } else {
        // Only the Fabric API modules this mod actually uses. The mod still requires the
        // full Fabric API at runtime (see fabric.mod.json), this just keeps the compile
        // classpath small.
        [
                'fabric-api-base',
                'fabric-lifecycle-events-v1',
                'fabric-entity-events-v1',
                'fabric-command-api-v2',
                'fabric-networking-api-v1',
                'fabric-events-interaction-v0',
                'fabric-message-api-v1'
        ].each { module ->
            modImplementation fabricApi.module(module, project.fabric_version)
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// ---------------------------------------------------------------------------
// Development helper.
//
// Minecraft's Yarn mappings change between versions, so before using an API it
// is useful to print the *actual* signatures available for the Minecraft
// version this project is pinned to. Run:
//
//   ./gradlew probe --no-configuration-cache
//
// It reads `dev/probe-list.txt` (one "fully.qualified.ClassName optional-regex"
// per line) and javaps each class against the remapped compile classpath.
// ---------------------------------------------------------------------------
// Lists (and dumps) every class in a package on the compile classpath. Useful when an API
// has moved and you do not know what the new class is called:
//
//   ./gradlew probePackage -PprobePackage=net/minecraft/command/permission --no-configuration-cache
tasks.register('probePackage') {
    description = 'Lists and javaps every class in a package on the compile classpath (development aid).'
    group = 'help'

    doLast {
        def prefix = (project.findProperty('probePackage') ?: '').toString()
        if (prefix.isEmpty()) {
            println 'Pass -PprobePackage=net/minecraft/some/package'
            return
        }

        def classpath = sourceSets.main.compileClasspath
        def found = new TreeSet<String>()

        classpath.each { file ->
            if (!file.name.endsWith('.jar') || !file.exists()) {
                return
            }
            try {
                new java.util.zip.ZipFile(file).withCloseable { zip ->
                    zip.entries().each { entry ->
                        if (entry.name.startsWith(prefix) && entry.name.endsWith('.class')) {
                            found << entry.name
                        }
                    }
                }
            } catch (Exception ignored) {
                // Not a readable jar - skip it.
            }
        }

        println "===== ${found.size()} classes under ${prefix}"
        found.each { println '  ' + it }

        def classpathText = classpath.asPath
        found.each { entry ->
            def className = entry.replace('/', '.').replaceAll(/\.class$/, '')
            println "===== ${className}"
            def scratch = File.createTempFile('probe', '.txt')
            def process = new ProcessBuilder(['javap', '-classpath', classpathText, className])
                    .redirectErrorStream(true)
                    .redirectOutput(scratch)
                    .start()
            if (process.waitFor(30, java.util.concurrent.TimeUnit.SECONDS)) {
                scratch.readLines().each { println '  ' + it.trim() }
            } else {
                process.destroyForcibly()
                println '  (timed out)'
            }
            scratch.delete()
        }
    }
}

tasks.register('probe') {
    description = 'Prints javap output for classes listed in dev/probe-list.txt (development aid).'
    group = 'help'

    doLast {
        def classpath = sourceSets.main.compileClasspath.asPath
        def listFile = file(project.findProperty('probeList') ?: 'dev/probe-list.txt')
        if (!listFile.exists()) {
            println "No probe list at ${listFile}"
            return
        }

        listFile.eachLine { rawLine ->
            def line = rawLine.trim()
            if (line.isEmpty() || line.startsWith('#')) {
                return
            }

            def parts = line.split(/\s+/, 2)
            def className = parts[0]
            def filter = parts.length > 1 ? parts[1] : null

            println "===== ${className}${filter ? '   ~/' + filter + '/' : ''}"

            // Output goes to a file rather than a pipe: reading a pipe blocks, which makes
            // a javap that never returns hang the whole build.
            def scratch = File.createTempFile('probe', '.txt')
            def process = new ProcessBuilder(['javap', '-classpath', classpath, className])
                    .redirectErrorStream(true)
                    .redirectOutput(scratch)
                    .start()
            if (!process.waitFor(30, java.util.concurrent.TimeUnit.SECONDS)) {
                process.destroyForcibly()
                println '  (timed out)'
                scratch.delete()
                return
            }

            scratch.readLines().each { outputLine ->
                if (filter == null || outputLine =~ filter) {
                    println '  ' + outputLine.trim()
                }
            }
            scratch.delete()
        }
    }
}
